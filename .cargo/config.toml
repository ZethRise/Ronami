[alias]
# Using `--features=full` instead of `--all-features` because of
# https://github.com/rust-lang/cargo/issues/10333
#
# "tokio/macros" and "tokio/rt-multi-thread" are required for examples
#
# This builds the docs on stable Rust. docs.rs builds them on nightly with the
# `nightly` feature (see `package.metadata.docs.rs`), which enables the
# `This is supported on feature="..." only.` banners.
docs = """doc
--no-deps
--features=full
--features=tokio/macros --features=tokio/rt-multi-thread
"""

[build]
# We pass "--cfg docsrs" when building docs to add `This is supported on feature="..." only.`
#
# FIXME: add back `-Znormalize-docs` once <https://github.com/rust-lang/rust/issues/81091> is fixed
#        or we don't depend on `generic-array` anymore
#
# N.B.: when changing this, also change `RUSTDOCFLAGS` in `.github/workflows/ci.yml` and
#      `package.metadata.docs.rs.rustdoc-args` in `crates/ronami/Cargo.toml`
rustdocflags = ["--cfg", "docsrs"]

[env]
# Deserializing a deeply nested `Message` needs a lot of stack in unoptimized builds, more than the
# default 2 MiB of a test thread.
RUST_MIN_STACK = { value = "8388608", force = false }
